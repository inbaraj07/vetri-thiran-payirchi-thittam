{% extends 'base.html' %}{% block title %}Party Budget Planner · PocketSmart AI{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">PLANNER</p><h1>Party Budget Planner</h1><p>Plan your event without losing control of the total budget</p></section><form id="partyForm" class="planner-form card"><div class="form-grid"><label>Budget<input name="budget" type="number" min="1" step="1" required></label><label>Currency<select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option></select></label><label>Guests<input name="guest_count" type="number" min="1" required></label><label>Event Type<input name="event_type" required placeholder="Birthday"></label><label>Venue / City<input name="venue" placeholder="Vellore"></label><label>Food Preference<select name="food_preference"><option>Mixed</option><option>Vegetarian</option><option>Non-vegetarian</option></select></label></div><label>Notes<textarea name="notes" rows="3"></textarea><button class="btn primary" type="submit">Generate recommendations</button><p id="formMessage" class="message"></p></form><section id="result" class="results"></section>{% endblock %}{% block scripts %}<script>setupPartyPlanner();</script>{% endblock %}
