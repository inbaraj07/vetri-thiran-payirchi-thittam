{% extends 'base.html' %}{% block title %}Jewelry Budget Planner · PocketSmart AI{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">PLANNER</p><h1>Jewelry Budget Planner</h1><p>Describe the occasion and outfit, and optionally upload an outfit image</p></section><form id="jewelryForm" class="planner-form card"><div class="form-grid"><label>Budget<input name="budget" type="number" min="1" step="1" required></label><label>Currency<select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option></select></label><label>Occasion<input name="occasion" required placeholder="Wedding"></label><label>Style<select name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Statement</option><option>Contemporary</option></select></label></div><label>Outfit description<textarea name="outfit_description" rows="4"></textarea></label><label>Optional outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Notes<textarea name="notes" rows="3"></textarea></label><button class="btn primary" type="submit">Generate recommendations</button><p id="formMessage" class="message"></p></form><section id="result" class="results"></section>{% endblock %}{% block scripts %}<script>setupJewelryPlanner();</script>{% endblock %}
